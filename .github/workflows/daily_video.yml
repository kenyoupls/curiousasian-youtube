name: Daily Video Pipeline

on:
  schedule:
    # Runs daily at 00:00 UTC (8:00 AM Singapore time)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install FFmpeg and fonts
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY }}
          GEMINI_VOICE_KEY: ${{ secrets.GEMINI_VOICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u -m src.pipeline

      - name: Upload video as artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: video-${{ github.run_number }}
          path: |
            output/final_video.mp4
            output/thumbnail.png
            output/script.json
          retention-days: 7

      - name: Commit updated script tracking
        if: always()
        run: |
          git config user.name "CuriousAsian Bot"
          git config user.email "bot@curiosasian.com"
          git add scripts/ data/
          git diff --cached --quiet || git commit -m "Pipeline run [$(date +%Y-%m-%d)]"
          # Pull with rebase; on conflict, accept ours (pipeline data is fresher)
          if ! git pull --rebase; then
            git checkout --theirs . 2>/dev/null || true
            git add -A
            git rebase --continue --no-edit || git rebase --skip
          fi
          git push || echo "⚠️ Push failed — changes will be included in next run"

      - name: Clean up output files
        if: always()
        run: |
          rm -rf output/
